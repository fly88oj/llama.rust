name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Report runner CPU features
        run: |
          echo "nproc: $(nproc)"
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx|avx2|avx512f|avx512bw|avx512dq|avx512vl|fma|f16c|avx512vnni)$' | sort -u || true

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast -- --test-threads 1
