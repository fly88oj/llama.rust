[package]
name = "llama-quantize"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "llama-quantize"
path = "src/main.rs"

[dependencies]
ggml = { path = "../../ggml" }
llama = { path = "../../llama" }
memmap2 = { workspace = true }
